<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 128" width="430" height="128">
  <!-- Tootsy wordmark: the OO Eyes mark, then the name with the two o's as eyes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#818cf8" stop-opacity="0.5"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.6" stop-color="#818cf8"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
  </defs>

  <!-- mark -->
  <g>
    <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
    <circle cx="64" cy="60" r="50" fill="url(#glow)"/>
    <circle cx="42" cy="56" r="20" fill="#ffffff" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="86" cy="56" r="20" fill="#ffffff" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="45" cy="59" r="8" fill="#1e1b4b"/><circle cx="89" cy="59" r="8" fill="#1e1b4b"/>
    <circle cx="48" cy="56" r="3" fill="#ffffff"/><circle cx="92" cy="56" r="3" fill="#ffffff"/>
    <path d="M44 92q20 16 40 0" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="28" cy="84" rx="6" ry="3.5" fill="#f472b6" opacity="0.7"/>
    <ellipse cx="100" cy="84" rx="6" ry="3.5" fill="#f472b6" opacity="0.7"/>
  </g>

  <!-- wordmark: T  o o  tsy — the o's drawn as eye rings -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#text)">
    <text x="146" y="86" letter-spacing="-1.5">T</text>
    <text x="298" y="86" letter-spacing="-1.5">tsy</text>
  </g>
  <g>
    <circle cx="219" cy="62" r="21" fill="#ffffff" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="266" cy="62" r="21" fill="#ffffff" stroke="url(#ring)" stroke-width="7"/>
    <circle cx="222" cy="65" r="8.5" fill="#1e1b4b"/><circle cx="269" cy="65" r="8.5" fill="#1e1b4b"/>
    <circle cx="225" cy="62" r="3" fill="#ffffff"/><circle cx="272" cy="62" r="3" fill="#ffffff"/>
  </g>
</svg>
